{{- $related := (.Site.RegularPages.Related .) | first 4 -}}
{{- with $related }}
<aside class="az-related" aria-labelledby="az-related-heading">
    <h2 class="az-related-heading" id="az-related-heading">次に読む</h2>
    {{- range . }}
    <a class="az-related-card" href="{{ .RelPermalink }}">
        <small>{{ .Date.Format "2006.01.02" }} · {{ .ReadingTime }} MIN READ</small>
        <strong>{{ .Title }}</strong>
    </a>
    {{- end }}
</aside>
{{- end }}
