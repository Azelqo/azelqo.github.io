# Azelqo — Hexo site configuration
title: Azelqo
subtitle: 日々の学びや考えたことを記録する
description: 日々の学びや考えたこと、覚えておきたいことを自分のペースで記録する個人ブログ。
keywords:
  - Azelqo
  - 備忘録
author: Azelqo
language: ja
timezone: Asia/Tokyo

url: https://azelqo.github.io
root: /
permalink: /:year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public-hexo
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: []

theme: materialis
theme_config:
  language: ja

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []

post_asset_folder: true
relative_link: false
future: false
highlight:
  enable: false

deploy:
  type: ''
