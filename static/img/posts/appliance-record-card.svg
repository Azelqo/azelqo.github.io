<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">家電の情報をまとめるメモカード</title><desc id="desc">家電の名前、型番、購入日、保証書の保管場所を一枚にまとめる図。</desc>
<rect width="1200" height="675" rx="34" fill="#f0eee8"/>
<circle cx="1040" cy="110" r="150" fill="#d9e2dd"/>
<circle cx="100" cy="600" r="180" fill="#e5d8c8"/>
<text x="76" y="100" fill="#26352f" font-size="42" font-weight="700" font-family="sans-serif">説明書を探す時間を減らす</text>
<text x="78" y="145" fill="#63736b" font-size="22" font-family="sans-serif">家電ごとに、必要な情報だけを一枚へ</text>
<rect x="230" y="205" width="740" height="390" rx="28" fill="#fffdf8" stroke="#c8d1ca" stroke-width="3"/>
<rect x="280" y="250" width="250" height="290" rx="18" fill="#e4ebe6"/>
<rect x="355" y="295" width="100" height="185" rx="10" fill="#7e9589"/>
<rect x="365" y="310" width="80" height="65" rx="7" fill="#dfe8e2"/>
<circle cx="405" cy="430" r="10" fill="#e7eee9"/>
<text x="405" y="515" fill="#43594e" font-size="19" text-anchor="middle" font-family="sans-serif">家電のイメージ</text>
<g font-family="sans-serif">
<text x="580" y="285" fill="#7b8d82" font-size="17">NAME / 家電名</text><text x="580" y="320" fill="#26352f" font-size="26" font-weight="700">リビングのエアコン</text>
<path d="M580 340 H900" stroke="#d9dfd9" stroke-width="2"/>
<text x="580" y="382" fill="#7b8d82" font-size="17">MODEL / 型番</text><text x="580" y="415" fill="#26352f" font-size="25" font-weight="700">本体ラベルを確認</text>
<path d="M580 435 H900" stroke="#d9dfd9" stroke-width="2"/>
<text x="580" y="478" fill="#7b8d82" font-size="17">PURCHASE / 購入日</text><text x="580" y="510" fill="#26352f" font-size="23">2026年  月  日</text>
<text x="580" y="555" fill="#63736b" font-size="17">保証書の保管場所：書類ファイル</text>
</g>
<text x="76" y="635" fill="#63736b" font-size="17" font-family="sans-serif">Azelqo · オリジナル図版</text>
</svg>