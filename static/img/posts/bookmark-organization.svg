<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">ブックマークを整理する</title><desc id="desc">ブラウザーのお気に入りを用途別フォルダに分ける図</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171a1d"/><stop offset="1" stop-color="#353a3d"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><text x="80" y="100" fill="#d8c8a8" font-family="sans-serif" font-size="22" letter-spacing="6">AZELQO / DIGITAL</text><text x="80" y="205" fill="#f4f1e9" font-family="sans-serif" font-size="58" font-weight="700">ブックマークを整理する</text><text x="80" y="270" fill="#d4d2ca" font-family="sans-serif" font-size="32">増やすより、探せる形に。</text><g transform="translate(790 150)"><rect x="0" y="0" width="300" height="320" rx="24" fill="#242b2f" stroke="#7b8787" stroke-width="3"/><rect x="28" y="32" width="244" height="52" rx="12" fill="#394449"/><path d="M48 56h18m-9 -9v18" stroke="#e0c99f" stroke-width="4" stroke-linecap="round"/><g fill="#d9c29a"><path d="M44 122h38l12 12h150v52H44z"/><path d="M44 198h38l12 12h150v52H44z"/><path d="M44 274h38l12 12h150v22H44z"/></g><g fill="#20272b"><circle cx="70" cy="150" r="6"/><circle cx="70" cy="226" r="6"/><circle cx="70" cy="296" r="6"/></g></g><rect x="80" y="370" width="610" height="145" rx="22" fill="#242b2f" stroke="#6b7779" stroke-width="2"/><g font-family="sans-serif" fill="#f4f1e9"><text x="120" y="425" font-size="25" font-weight="700">毎日使う</text><text x="315" y="425" font-size="25" font-weight="700">調べもの</text><text x="510" y="425" font-size="25" font-weight="700">あとで読む</text><text x="120" y="472" fill="#c5c6c1" font-size="18">必要な場所へ、すぐ戻る。</text></g><text x="80" y="580" fill="#c9c6bc" font-family="sans-serif" font-size="19">フォルダは少なく、名前は具体的に。</text></svg>