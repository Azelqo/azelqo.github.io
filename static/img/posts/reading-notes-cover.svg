<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">読書メモを三つだけ残す</title><desc id="desc">開いた本と三つのメモカードを描いた図</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202322"/><stop offset="1" stop-color="#44413a"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><text x="80" y="100" fill="#d9c8a4" font-family="sans-serif" font-size="22" letter-spacing="6">AZELQO / READING</text><text x="80" y="205" fill="#f5f1e8" font-family="sans-serif" font-size="58" font-weight="700">読書メモは、三つだけ。</text><text x="80" y="270" fill="#d4d0c5" font-family="sans-serif" font-size="32">残った場面・理由・次の問い</text><g transform="translate(790 150)"><path d="M0 55Q130 15 260 55v270Q130 230 0 325z" fill="#e7ddc9" stroke="#b8a88d" stroke-width="4"/><path d="M260 55Q390 15 520 55v270Q390 230 260 325z" fill="#f1e9d9" stroke="#b8a88d" stroke-width="4"/><path d="M260 55v270" stroke="#b8a88d" stroke-width="4"/><g stroke="#b7ad9a" stroke-width="4"><path d="M35 100h175M35 140h175M35 180h175M305 100h175M305 140h175M305 180h175"/></g></g><rect x="80" y="370" width="600" height="140" rx="22" fill="#2b3331" stroke="#7b8278" stroke-width="2"/><g font-family="sans-serif" fill="#f5f1e8"><text x="120" y="425" font-size="25" font-weight="700">何が残った？</text><text x="120" y="470" font-size="22">なぜ？　次に考えたいことは？</text></g><text x="80" y="580" fill="#c9c6bc" font-family="sans-serif" font-size="19">長い要約より、自分の言葉を短く残す。</text></svg>