<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">家電の型番ラベルを探す場所</title><desc id="desc">冷蔵庫、洗濯機、エアコンの型番ラベルの場所は機種ごとに違うため、本体の側面や扉の内側などを説明書で確認する図。</desc>
<rect width="1200" height="675" rx="34" fill="#f7f5ef"/>
<text x="72" y="90" fill="#26352f" font-size="40" font-weight="700" font-family="sans-serif">型番ラベルを探すときのヒント</text>
<text x="74" y="132" fill="#68776f" font-size="21" font-family="sans-serif">場所は製品・機種によって異なります</text>
<g font-family="sans-serif" text-anchor="middle">
<rect x="80" y="205" width="320" height="330" rx="22" fill="#e5ece7"/>
<rect x="180" y="250" width="120" height="220" rx="12" fill="#8ba195"/>
<rect x="193" y="270" width="94" height="78" rx="6" fill="#dbe6df"/>
<rect x="208" y="365" width="64" height="82" rx="5" fill="#f8f7f2"/>
<text x="240" y="505" fill="#30453a" font-size="22" font-weight="700">冷蔵庫</text><text x="240" y="565" fill="#52685c" font-size="17">扉の内側など</text>
<rect x="440" y="205" width="320" height="330" rx="22" fill="#e5ece7"/>
<rect x="540" y="265" width="120" height="190" rx="18" fill="#8ba195"/>
<circle cx="600" cy="350" r="42" fill="#dbe6df" stroke="#52685c" stroke-width="5"/>
<rect x="555" y="280" width="90" height="18" rx="5" fill="#f8f7f2"/>
<text x="600" y="505" fill="#30453a" font-size="22" font-weight="700">洗濯機</text><text x="600" y="565" fill="#52685c" font-size="17">側面・背面など</text>
<rect x="800" y="205" width="320" height="330" rx="22" fill="#e5ece7"/>
<rect x="875" y="275" width="170" height="110" rx="18" fill="#8ba195"/>
<path d="M900 350 H1020" stroke="#dbe6df" stroke-width="9" stroke-linecap="round"/>
<path d="M920 405 q-18 30 0 50 M960 405 q-18 30 0 50 M1000 405 q-18 30 0 50" fill="none" stroke="#6f8a7b" stroke-width="6" stroke-linecap="round"/>
<text x="960" y="505" fill="#30453a" font-size="22" font-weight="700">エアコン</text><text x="960" y="565" fill="#52685c" font-size="17">本体・室外機など</text>
</g>
<text x="72" y="625" fill="#68776f" font-size="18" font-family="sans-serif">必ず取扱説明書またはメーカー公式サポートで確認してください。</text>
</svg>