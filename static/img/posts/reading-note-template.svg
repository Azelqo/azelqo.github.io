<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">三つの読書メモ</title><desc id="desc">印象に残ったこと、その理由、次の問いを記録するテンプレート</desc><rect width="1200" height="630" fill="#f4f2ec"/><text x="70" y="82" fill="#303a38" font-family="sans-serif" font-size="38" font-weight="700">一冊につき、この三つを残す</text><g font-family="sans-serif"><rect x="70" y="155" width="320" height="300" rx="20" fill="#fff" stroke="#c2b9a7" stroke-width="2"/><circle cx="230" cy="220" r="38" fill="#e8dfcc"/><text x="230" y="234" text-anchor="middle" fill="#6a573c" font-size="34" font-weight="700">1</text><text x="230" y="310" text-anchor="middle" fill="#303a38" font-size="26" font-weight="700">残ったこと</text><text x="230" y="360" text-anchor="middle" fill="#6b716b" font-size="19">場面・考え・言葉</text><text x="230" y="395" text-anchor="middle" fill="#6b716b" font-size="19">一つだけ選ぶ</text><rect x="440" y="155" width="320" height="300" rx="20" fill="#fff" stroke="#c2b9a7" stroke-width="2"/><circle cx="600" cy="220" r="38" fill="#e8dfcc"/><text x="600" y="234" text-anchor="middle" fill="#6a573c" font-size="34" font-weight="700">2</text><text x="600" y="310" text-anchor="middle" fill="#303a38" font-size="26" font-weight="700">理由</text><text x="600" y="360" text-anchor="middle" fill="#6b716b" font-size="19">なぜ気になった？</text><text x="600" y="395" text-anchor="middle" fill="#6b716b" font-size="19">自分の言葉で書く</text><rect x="810" y="155" width="320" height="300" rx="20" fill="#fff" stroke="#c2b9a7" stroke-width="2"/><circle cx="970" cy="220" r="38" fill="#e8dfcc"/><text x="970" y="234" text-anchor="middle" fill="#6a573c" font-size="34" font-weight="700">3</text><text x="970" y="310" text-anchor="middle" fill="#303a38" font-size="26" font-weight="700">次の問い</text><text x="970" y="360" text-anchor="middle" fill="#6b716b" font-size="19">読み終えた後に</text><text x="970" y="395" text-anchor="middle" fill="#6b716b" font-size="19">考えたいこと</text><text x="70" y="535" fill="#6b716b" font-size="19">書誌情報とページ番号も添えると、後から本を探しやすい。</text></g></svg>