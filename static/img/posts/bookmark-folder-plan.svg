<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">ブックマークのフォルダ設計例</title><desc id="desc">用途別の大分類から必要なページへ分ける構成図</desc><rect width="1200" height="630" fill="#f3f3ef"/><text x="70" y="80" fill="#2a3438" font-family="sans-serif" font-size="38" font-weight="700">フォルダは「用途」で分ける</text><rect x="430" y="130" width="340" height="82" rx="18" fill="#343f43"/><text x="600" y="182" text-anchor="middle" fill="#f5f1e7" font-family="sans-serif" font-size="28" font-weight="700">ブックマーク</text><g stroke="#9a9b91" stroke-width="4" fill="none"><path d="M600 212v55H220v48M600 267v48M600 267h380v48"/></g><g font-family="sans-serif" text-anchor="middle"><rect x="70" y="315" width="300" height="160" rx="18" fill="#e6ece8" stroke="#9eaaa2" stroke-width="2"/><text x="220" y="365" fill="#344a3f" font-size="25" font-weight="700">毎日使う</text><text x="220" y="410" fill="#53645a" font-size="18">連絡・学習・よく見るサイト</text><text x="220" y="445" fill="#53645a" font-size="18">数を絞ってすぐ開ける</text><rect x="450" y="315" width="300" height="160" rx="18" fill="#eee8dc" stroke="#b9a88b" stroke-width="2"/><text x="600" y="365" fill="#66533b" font-size="25" font-weight="700">調べもの</text><text x="600" y="410" fill="#76664f" font-size="18">テーマ別の資料</text><text x="600" y="445" fill="#76664f" font-size="18">必要ならサブフォルダ</text><rect x="830" y="315" width="300" height="160" rx="18" fill="#e6e9ee" stroke="#9da9b8" stroke-width="2"/><text x="980" y="365" fill="#3d4b5c" font-size="25" font-weight="700">あとで読む</text><text x="980" y="410" fill="#59687a" font-size="18">期限を決めて保存</text><text x="980" y="445" fill="#59687a" font-size="18">月末に見直す</text></g><text x="70" y="555" fill="#606b6d" font-family="sans-serif" font-size="19">これは一例。自分が探すときの言葉をフォルダ名にする。</text></svg>