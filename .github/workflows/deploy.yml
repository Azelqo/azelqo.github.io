name: Deploy Azelqo (Hexo + Hugo archive)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync Notion notes"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install Hexo dependencies
        run: npm install

      - name: Build Hexo + Materialis
        run: |
          npx hexo clean
          npx hexo generate
          test -s public-hexo/index.html

      - name: Prepare combined Pages directory
        run: |
          mkdir -p public
          cp -a public-hexo/. public/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Install Dart Sass for Hugo Stack
        env:
          DART_SASS_VERSION: "1.108.2"
        run: |
          mkdir -p "$HOME/.local"
          curl -fsSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" -o "$RUNNER_TEMP/dart-sass.tar.gz"
          tar -C "$HOME/.local" -xf "$RUNNER_TEMP/dart-sass.tar.gz"
          echo "$HOME/.local/dart-sass" >> "$GITHUB_PATH"
          "$HOME/.local/dart-sass/sass" --embedded --version

      - name: Resolve Hugo theme module
        run: hugo mod get

      - name: Build legacy Hugo site under /original/
        run: hugo --minify --printPathWarnings --destination "$GITHUB_WORKSPACE/public/original"

      - name: Verify both sites
        run: |
          test -s public/index.html
          test -s public/original/index.html
          test -s public/original/sitemap.xml
          test -s public/original/robots.txt
          echo "Hexo root and Hugo archive are present."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
