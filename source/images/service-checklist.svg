<g><rect x="325" y="218" width="250" height="145" rx="18" fill="#fff" stroke="#30343b" stroke-width="2"/><text x="450" y="271" font-size="17" fill="#737b87">05</text><text x="450" y="315" font-size="26" font-weight="700" fill="#20242b">対応環境</text></g>
<g><rect x="612" y="218" width="250" height="145" rx="18" fill="#252a33"/><text x="737" y="271" font-size="17" fill="#c5cbd4">06</text><text x="737" y="315" font-size="26" font-weight="700" fill="#fff">終了方法</text></g>
