baseURL = "https://azelqo.github.io/"
languageCode = "ja-JP"
defaultContentLanguage = "ja"
locale = "ja-JP"
hasCJKLanguage = true
title = "Azelqo"
theme = "stack"
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true

[pagination]
  pagerSize = 8

[permalinks]
  post = "/p/:slug/"
  page = "/:slug/"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "ホーム"
    url = "/"
    weight = 1
    [menu.main.params]
      icon = "home"
  [[menu.main]]
    identifier = "archives"
    name = "アーカイブ"
    url = "/archives/"
    weight = 2
    [menu.main.params]
      icon = "archives"
  [[menu.main]]
    identifier = "tags"
    name = "タグ"
    url = "/tags/"
    weight = 4
    [menu.main.params]
      icon = "tag"
  [[menu.main]]
    identifier = "search"
    name = "記事を検索"
    url = "/search/"
    weight = 5
    [menu.main.params]
      icon = "search"
  [[menu.main]]
    identifier = "links"
    name = "リンク"
    url = "/links/"
    weight = 6
    [menu.main.params]
      icon = "link"
  [[menu.main]]
    identifier = "about"
    name = "このブログについて"
    url = "/about/"
    weight = 7
    [menu.main.params]
      icon = "user"

[params]
  mainSections = ["posts"]
  rssFullContent = true
  favicon = "favicon.svg"
  description = "勉強法や学習習慣、受験対策、日々の気づきを記録する匿名の個人ブログ。実際に試せる勉強の工夫を、具体例とともに紹介します。"
  image = "/ogp.svg"
  [params.footer]
    since = 2026
  [params.sidebar]
    avatar = "img/avatar.jpg"
    compact = false
    subtitle = "学びの記録と、日々の気づき。"
  [params.article]
    headingAnchor = true
    toc = true
    readingTime = true
    [params.article.license]
      enabled = false
  [params.widgets]
    homepage = [
      { type = "search" },
      { type = "archives", params = { limit = 8 } },
      { type = "categories", params = { limit = 10 } },
      { type = "tag-cloud", params = { limit = 18 } },
    ]
    page = [
      { type = "toc" },
      { type = "archives", params = { limit = 5 } },
      { type = "categories", params = { limit = 8 } },
      { type = "tag-cloud", params = { limit = 12 } },
    ]
  [params.colorScheme]
    toggle = true
    default = "auto"
  [params.comments]
    enabled = false
  [params.opengraph]
    [params.opengraph.twitter]
      card = "summary_large_image"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = true
    startLevel = 2
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    tabWidth = 4
