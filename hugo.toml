baseURL = "https://azelqo.github.io/"
languageCode = "ja-JP"
defaultContentLanguage = "ja"
locale = "ja-JP"
hasCJKLanguage = true
title = "MANABIXX"
theme = "stack"
enableRobotsTXT = true
enableGitInfo = true

[pagination]
  pagerSize = 8

[permalinks]
  post = "/p/:slug/"
  page = "/:slug/"

[params]
  mainSections = ["posts"]
  rssFullContent = true
  favicon = "favicon.svg"
  description = "勉強のモチベーション、学習法、高校・高専・大学の進路情報を届ける教育メディア。"
  [params.footer]
    since = 2026
  [params.sidebar]
    avatar = "img/avatar.jpg"
    compact = false
    subtitle = "学びの選択肢を広げる、受験と進路のメディア。"
  [params.article]
    headingAnchor = true
    toc = true
    readingTime = true
    [params.article.license]
      enabled = false
  [params.widgets]
    homepage = [
      { type = "search" },
      { type = "archives", params = { limit = 8 } },
      { type = "categories", params = { limit = 10 } },
      { type = "tag-cloud", params = { limit = 18 } },
    ]
    page = [
      { type = "toc" },
      { type = "archives", params = { limit = 5 } },
      { type = "categories", params = { limit = 8 } },
      { type = "tag-cloud", params = { limit = 12 } },
    ]
  [params.colorScheme]
    toggle = true
    default = "auto"
  [params.comments]
    enabled = false

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    endLevel = 4
    ordered = true
    startLevel = 2
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    tabWidth = 4
